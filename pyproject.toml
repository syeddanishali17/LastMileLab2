[project]
name = "lastmile-lab-viennacart"
version = "0.1.0"
description = "LastMile Lab: ViennaCart CVRP Dispatch Planner"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["backend", "frontend"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "tests", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "api_client", "components", "display", "inspector", "maps", "state"]
