[project]
name = "lastmile-lab-viennacart"
version = "0.1.0"
description = "LastMile Lab: ViennaCart CVRP Dispatch Planner"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["backend", "frontend"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "tests", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = [
    "app",
    "api_client",
    "components",
    "display",
    "i18n",
    "inspector",
    "maps",
    "scenario_builder",
    "state",
    "workflow_copy",
]

[tool.ruff.lint.per-file-ignores]
"frontend/i18n.py" = ["E501"]
"frontend/workflow_copy.py" = ["E501"]
